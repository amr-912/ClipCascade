name: Bidirectional clipboard reliability (Android + Windows)

on:
  push:
    branches:
      - 'test/screenshot-preview-release-2026-10-30'
  pull_request:
    paths:
      - 'ClipCascade_Mobile/src/StartForegroundService.js'
      - 'ClipCascade_Mobile/src/App.js'
      - 'ClipCascade_Mobile/src/android/app/src/main/java/com/clipcascade/**'
      - 'ClipCascade_Mobile/src/android/app/src/test/**'
      - 'ClipCascade_Mobile/src/android/app/build.gradle'
      - 'ClipCascade_Desktop/src/p2p/p2p_manager.py'
      - 'ClipCascade_Desktop/src/p2p/ice_server_config.py'
      - 'ClipCascade_Mobile/src/IceServerConfig.js'
      - 'ClipCascade_Mobile/src/IcePathDiagnostics.js'
      - 'tests/test_ice_path_diagnostics.cjs'
      - 'ClipCascade_Mobile/src/UpdateChecker.js'
      - 'ClipCascade_Server/ClipCascade_Backend/src/main/java/**'
      - 'tests/test_ice_server_config.py'
      - 'tests/test_ice_server_config.cjs'
      - 'tests/test_android_receipt_ack.cjs'
      - 'tests/test_turn_worker.mjs'
      - 'cloudflare/turn-issuer/**'
      - 'ClipCascade_Server/ClipCascade_Backend/src/test/java/**'
      - 'tests/test_android_clipboard_transport.cjs'
      - 'docs/ANDROID_SCREENSHOT_FIELD_TEST.md'
      - 'tests/test_clipboard_p2p_backpressure.py'
      - 'tests/test_p2p_receipt_ack.py'
      - '.github/workflows/bidirectional_clipboard_tests.yml'
  workflow_dispatch:

concurrency:
  group: bidirectional-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-behavior:
    name: JS syntax and actual outbound function behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse full service script
        run: node --check ClipCascade_Mobile/src/StartForegroundService.js && node --check ClipCascade_Mobile/src/IceServerConfig.js && node --check ClipCascade_Mobile/src/IcePathDiagnostics.js
      - name: Run transfer and native-bridge regression tests
        run: node --test tests/test_android_clipboard_transport.cjs tests/test_ice_server_config.cjs tests/test_ice_path_diagnostics.cjs tests/test_turn_worker.mjs tests/test_android_receipt_ack.cjs

  windows-p2p:
    name: Windows P2P regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pillow requests
      - run: python -m pytest -q tests/test_clipboard_p2p_backpressure.py tests/test_ice_server_config.py tests/test_desktop_preview_update.py tests/test_p2p_receipt_ack.py
      - name: Verify safe existing-session TURN diagnostic on Windows (no network)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "ClipCascade-DATA-fixture"
          @{server_url="https://sync.world-honey.com";cookie=@{JSESSIONID="fixture-cookie-do-not-print-123"}} | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 $fixture
          $output = & ./tools/Diagnose-ClipCascadeTurn.ps1 -DataPath $fixture -InspectOnly
          $joined = $output -join "`n"
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "PowerShell probe failed" }
          if ($joined -notmatch "RESULT=INSPECT_ONLY_NO_NETWORK") { throw "Valid session fixture not detected" }
          if ($joined -match "fixture-cookie|JSESSIONID=") { throw "Probe disclosed credentials" }
          @{server_url="https://untrusted.example";cookie=@{JSESSIONID="fixture-cookie-do-not-print-123"}} | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 $fixture
          $rejected = (& ./tools/Diagnose-ClipCascadeTurn.ps1 -DataPath $fixture) -join "`n"
          if ($rejected -notmatch "RESULT=SERVER_HOST_MISMATCH") { throw "Probe did not reject foreign host" }


  backend-turn:
    name: Compile authenticated TURN credential issuer (Spring Boot JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Spring Boot TURN endpoint without live credentials
        working-directory: ClipCascade_Server/ClipCascade_Backend
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=IceServersControllerTest test

  android-native:
    name: Compile real Android Kotlin modules
    needs: [android-behavior, windows-p2p, backend-turn]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check GitHub runner Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          echo "Using preinstalled SDK at $ANDROID_HOME"
      - name: Materialize upstream tracked Gradle CI defaults (without signing secrets)
        run: |
          cp ClipCascade_Mobile/src/android/gradle.properties.ci ClipCascade_Mobile/src/android/gradle.properties
          # Production signing inputs are intentionally blank in the public
          # template. Remove them for debug/preview builds so Gradle does not
          # try to interpret an empty keystore path as a File.
          sed -i '/^MYAPP_UPLOAD_/d' ClipCascade_Mobile/src/android/gradle.properties
      - name: Install locked dependencies
        working-directory: ClipCascade_Mobile/src
        run: npm ci --no-audit --no-fund
      - name: Compile native Android bridge and clipboard listeners
        working-directory: ClipCascade_Mobile/src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin -PhermesEnabled=true --no-daemon --stacktrace
      - name: Verify real Android ClipData and screenshot whitelist with Robolectric
        working-directory: ClipCascade_Mobile/src/android
        run: ./gradlew :app:testDebugUnitTest --tests com.clipcascade.ClipboardContentSelectorTest --tests com.clipcascade.ScreenshotMediaMonitorTest -PhermesEnabled=true --no-daemon
      - name: Package separately installable Android preview APK
        working-directory: ClipCascade_Mobile/src/android
        run: ./gradlew :app:assemblePreview -PhermesEnabled=true --no-daemon
      - name: Check preview package and create installation notes
        run: |
          APK=ClipCascade_Mobile/src/android/app/build/outputs/apk/preview/app-preview.apk
          test -s "$APK"
          mkdir -p android-preview
          cp "$APK" android-preview/ClipCascade-Preview-Bidirectional.apk
          cat > android-preview/README.txt <<'EOF'
          ClipCascade Android bidirectional test build.
          Package ID: com.clipcascade.preview (separate from official com.clipcascade).
          Build type: preview; debug-signed for testing, not production.
          Keep official app installed. STOP original ClipCascade before testing
          this preview; do not run two foreground clipboard monitors together.
          Log in to the same existing server from the preview.
          On Android 10+, to enable background copy interception, grant the
          preview app READ_LOGS and overlay appop with Android Debug Bridge:
            adb -d shell pm grant com.clipcascade.preview android.permission.READ_LOGS
            adb -d shell appops set com.clipcascade.preview SYSTEM_ALERT_WINDOW allow
          Then force-stop the preview and start it, accepting Android log access.
          Optional auto-sync of NEW saved screenshots: on the connected
          screen tap "Enable Auto-Sync Screenshots", grant ALL photos (not
          selected photos), then take a NEW screenshot. No historical scans.
          Screenshot permission can be revoked in Android Settings.
          On the connected screen, capture a NEW Samsung screenshot, return
          to Preview, then tap "Inspect Clipboard (metadata only)".
          Record event counts, MIME types, detectedType, imageReadable and
          lastTransportStage; do not share sensitive clipboard contents.
          Windows: open Paint and press Ctrl+V to confirm actual delivery.
          Technical decision tree: docs/ANDROID_SCREENSHOT_FIELD_TEST.md
          Do not install on top of the original app or upload passwords/keys.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Android-Bidirectional-Preview
          path: android-preview/*
          if-no-files-found: error
          retention-days: 14

  windows-preview:
    name: Package portable Windows TURN preview (isolated, no MSI)
    runs-on: windows-latest
    needs: [android-native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install pinned desktop build dependencies
        working-directory: ClipCascade_Desktop/src
        run: |
          python -m pip install pyinstaller
          python -m pip install -r requirements_win.txt
      - name: Package a standalone non-installing preview binary
        working-directory: ClipCascade_Desktop/src
        run: python -m PyInstaller ClipCascade_win.spec --noconfirm
      - name: Stage code identity and SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop-preview | Out-Null
          Copy-Item ClipCascade_Desktop/src/dist/ClipCascade.exe desktop-preview/ClipCascade-Preview.exe
          Copy-Item tools/Diagnose-ClipCascadeTurn.ps1 desktop-preview/Diagnose-ClipCascadeTurn.ps1
          "source_commit=$(git rev-parse HEAD)" | Set-Content desktop-preview/BUILD_INFO.txt
          "PORTABLE PREVIEW. Not an MSI. Stop stable before testing and backup DATA." | Add-Content desktop-preview/BUILD_INFO.txt
          "Diagnostic only: Diagnose-ClipCascadeTurn.ps1 can read the existing desktop DATA session without logging in or printing credentials." | Add-Content desktop-preview/BUILD_INFO.txt
          (Get-FileHash desktop-preview/ClipCascade-Preview.exe -Algorithm SHA256).Hash | Set-Content desktop-preview/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-Windows-Portable-TURN-Preview
          path: desktop-preview/*
          if-no-files-found: error
          retention-days: 14
