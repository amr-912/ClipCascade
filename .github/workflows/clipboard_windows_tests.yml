name: Windows clipboard image detection — unit tests
on:
  pull_request:
    paths:
      - 'ClipCascade_Desktop/src/clipboard/**'
      - 'ClipCascade_Desktop/src/p2p/p2p_manager.py'
      - 'tests/test_windows_clipboard.py'
      - 'tests/test_windows_clipboard_live.py'
      - 'tests/test_clipboard_image_encoding.py'
      - 'tests/test_clipboard_p2p_backpressure.py'
      - '.github/workflows/clipboard_windows_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clipboard-unit:
    name: Clipboard unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pillow
      - name: Install native Windows test dependency
        if: runner.os == 'Windows'
        run: python -m pip install pywin32==306
      - name: Run clipboard tests with Windows API stubs
        run: python -m pytest -q tests/test_windows_clipboard.py tests/test_clipboard_image_encoding.py tests/test_clipboard_p2p_backpressure.py
      - name: Windows clipboard integration test
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_windows_clipboard_live.py

  windows-preview:
    name: Build Windows EXE and MSI preview (3.3.5)
    runs-on: windows-latest
    needs: clipboard-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Assign preview version without modifying repository metadata
        shell: pwsh
        run: |
          $versions = Get-Content version.json -Raw | ConvertFrom-Json
          $versions.windows = '3.3.5'
          $env:VERSIONS_JSON = $versions | ConvertTo-Json -Compress
          python .github/scripts/apply_app_version.py desktop
          if ($LASTEXITCODE -ne 0) { throw 'Preview version injection failed' }
      - name: Install Windows dependencies
        working-directory: ClipCascade_Desktop/src
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements_win.txt
      - name: Build portable EXE
        working-directory: ClipCascade_Desktop/src
        run: python -m PyInstaller ClipCascade_win.spec --noconfirm --clean
      - name: Verify EXE size
        shell: pwsh
        run: |
          $file = 'ClipCascade_Desktop/src/dist/ClipCascade.exe'
          if (-not (Test-Path $file)) { throw 'Portable EXE missing' }
          if ((Get-Item $file).Length -lt 1000000) { throw 'Unexpectedly small EXE' }
      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          choco install -y wixtoolset --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          $wixBin = Join-Path $env:WIX 'bin'
          if (-not (Test-Path $wixBin)) {
            $wixBin = (Get-ChildItem 'C:\Program Files (x86)\WiX Toolset *\bin' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $wixBin -or -not (Test-Path $wixBin)) { throw 'WiX bin directory missing' }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin
      - name: Stage Windows installer
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'cc-preview-msi'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item ClipCascade_Desktop/src/dist/ClipCascade.exe $stage/
          Copy-Item LICENSE $stage/
          Copy-Item logo/logo.ico $stage/
          Copy-Item ClipCascade_Desktop/installer/windows/readme.txt $stage/
          python .github/scripts/generate_rtf.py LICENSE "$stage/LICENSE.rtf"
          if ($LASTEXITCODE -ne 0) { throw 'License generation failed' }
          "STAGE=$stage" >> $env:GITHUB_ENV
      - name: Build MSI upgrade installer (preview 3.3.5)
        shell: pwsh
        run: |
          candle.exe -arch x64 '-dProductVersion=3.3.5' "-dStagingDir=$env:STAGE" ClipCascade_Desktop/installer/windows/ClipCascade.wxs -out installer.wixobj
          if ($LASTEXITCODE -ne 0) { throw 'WiX compilation failed' }
          light.exe -ext WixUIExtension installer.wixobj -out ClipCascade-ClipboardPreview-3.3.5.msi
          if ($LASTEXITCODE -ne 0) { throw 'WiX linking failed' }
          if (-not (Test-Path 'ClipCascade-ClipboardPreview-3.3.5.msi')) { throw 'MSI missing' }
      - name: Prepare user-facing preview files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'preview-output' | Out-Null
          Copy-Item ClipCascade-ClipboardPreview-3.3.5.msi preview-output/
          @'
          ClipCascade Windows clipboard preview 3.3.5 (unsigned, test build).
          This is NOT the upstream official release. Source: amr-912/ClipCascade.
          Recommended: close ClipCascade on Windows (Quit) before MSI install.
          Back up C:\ClipCascade\DATA locally if that file exists. Do not upload it:
          it contains account/session configuration.
          The MSI is an upgrade over official version 3.3.1 if the same MSI
          upgrade identity and install scope/path are used. Verify installed
          version before applying; do not install over a newer version.
          Keep your Android ClipCascade version and server unchanged.
          Take a screenshot using Win+Shift+S and paste into an Android app
          that supports images. Windows/Android have different image handling.
          To roll back, uninstall preview then reinstall the official release.
          '@ | Set-Content preview-output/README-PREVIEW.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCascade-ClipboardFix-MSI-3.3.5
          path: |
            preview-output/ClipCascade-ClipboardPreview-3.3.5.msi
            preview-output/README-PREVIEW.txt
          if-no-files-found: error
          retention-days: 14
